name: docs
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache

      - run: |
          pip install mkdocs-material
          pip install mkdocs-file-filter-plugin

      - run: |
          cd docs
          mkdocs gh-deploy --force
