name: nightly build

on:
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: setup mkdocs
        run: |
          pip install mkdocs-material
          pip install mkdocs-file-filter-plugin

      - name: build offline docs
        run: |
          cd docs
          mkdocs build
        env:
          OFFLINE_DOCS: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create tag
        run: |
          echo "COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

          VERSION=$(grep -Eo 'version = "[0-9]+\.[0-9]+\.[0-9]+"' build.gradle.kts | sed 's/version = "//;s/"$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          REV="$(git rev-parse --short HEAD)"
          TAG="nightly/$VERSION+$REV"
          echo "TAG=$TAG" >> $GITHUB_ENV

          sed -i 's#version = "[0-9]\+\.[0-9]\+\.[0-9]\+"#version = "'"$VERSION+$REV-nightly"'"#g' build.gradle.kts
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew buildPlugin

      - name: Upload Nightly Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          commit: ${{ env.COMMIT }}
          artifacts: "build/distributions/*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
